<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Smart Remote Control</title>
  <style>
    :root {
      --bg-dark: #121212;
      --remote-body: #1e1e1e;
      --remote-border: #2d2d2d;
      --button-bg: #2a2a2a;
      --button-hover: #3a3a3a;
      --text-main: #ffffff;
      --text-sub: #8a8a8a;
      --power-red: #ff3b30;
      --mute-green: #34c759;
      --color-yellow: #ffcc00;
      --color-cyan: #00c7fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Remote Case Container */
    .remote-container {
      background: linear-gradient(145deg, #242424, #161616);
      width: 280px;
      padding: 30px 20px;
      border-radius: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 
                  inset 0 2px 3px rgba(255, 255, 255, 0.1),
                  inset 0 -3px 5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--remote-border);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Row 1: Power & Mute */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .btn-power {
      background-color: var(--power-red);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(255, 59, 48, 0.4);
    }

    .btn-mute {
      background-color: var(--mute-green);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(52, 199, 89, 0.4);
    }

    /* Keypad Grid (Numbers 0-9, Recall, Fav) */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 5px;
    }

    .btn-num {
      background: linear-gradient(135deg, #333, #222);
      color: var(--text-main);
      border: 1px solid #444;
      height: 42px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 5px rgba(0,0,0,0.3);
      transition: background 0.1s ease;
    }

    .btn-num:active, .btn-pill:active, .btn-circle:active, .color-btn:active {
      transform: scale(0.96);
      background: #111;
    }

    .label-sub {
      font-size: 0.65rem;
      color: var(--text-sub);
      font-weight: bold;
    }

    /* Rockers & Middle Controls */
    .rocker-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .rocker-track {
      background: #252525;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 90px;
      padding: 5px;
      border: 1px solid #333;
    }

    .rocker-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      height: 35px;
    }

    .rocker-label {
      color: var(--text-sub);
      font-size: 0.7rem;
      font-weight: bold;
    }

    .center-menu-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-pill {
      background: #2a2a2a;
      color: var(--text-main);
      border: 1px solid #3d3d3d;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Navigation D-Pad */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 160px;
      height: 160px;
      margin: 10px auto;
      position: relative;
    }

    .dpad-btn {
      background: #2a2a2a;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .dpad-up    { grid-area: 1 / 2 / 2 / 3; border-radius: 15px 15px 0 0; }
    .dpad-left  { grid-area: 2 / 1 / 3 / 2; border-radius: 15px 0 0 15px; }
    .dpad-enter { grid-area: 2 / 2 / 3 / 3; background: #1a1a1a; font-weight: bold; font-size: 0.7rem;}
    .dpad-right { grid-area: 2 / 3 / 3 / 4; border-radius: 0 15px 15px 0; }
    .dpad-down  { grid-area: 3 / 2 / 4 / 3; border-radius: 0 0 15px 15px; }

    /* Action Row (TV, Menu, Exit, Source) */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 10px;
    }

    /* Color Keys Row */
    .color-keys-row {
      display: flex;
      justify-content: space-between;
      padding: 0 5px;
    }

    .color-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 22%;
    }

    .color-btn {
      width: 100%;
      height: 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .color-btn.red    { background-color: var(--power-red); }
    .color-btn.green  { background-color: var(--mute-green); }
    .color-btn.yellow { background-color: var(--color-yellow); }
    .color-btn.cyan   { background-color: var(--color-cyan); }

    /* Media Playback Controls */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-circle {
      background: #222;
      border: 1px solid #333;
      color: white;
      height: 32px;
      border-radius: 50%;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Brand Logo styling */
    .brand-logo {
      text-align: center;
      color: var(--text-main);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 10px;
      text-transform: uppercase;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="remote-container">
    
    <!-- Row 1: Power & Mute -->
    <div class="top-controls">
      <button class="btn-power">⏽</button>
      <button class="btn-mute">🔇</button>
    </div>

    <!-- Number Keypad Layout -->
    <div class="keypad-grid">
      <button class="btn-num">1</button>
      <button class="btn-num">2</button>
      <button class="btn-num">3</button>
      <button class="btn-num">4</button>
      <button class="btn-num">5</button>
      <button class="btn-num">6</button>
      <button class="btn-num">7</button>
      <button class="btn-num">8</button>
      <button class="btn-num">9</button>
      <button class="btn-num">⟲</button>
      <button class="btn-num">0</button>
      <button class="btn-num <span class='label-sub'>">FAV</button>
    </div>

    <!-- Volume, Channel and Center Menu Controls -->
    <div class="rocker-section">
      <div class="rocker-track">
        <button class="rocker-btn">+</button>
        <span class="rocker-label">VOL</span>
        <button class="rocker-btn">−</button>
      </div>
      
      <div class="center-menu-stack">
        <button class="btn-pill">HOME</button>
        <button class="btn-pill">EPG</button>
        <button class="btn-pill">MTS</button>
      </div>

      <div class="rocker-track">
        <button class="rocker-btn">▲</button>
        <span class="rocker-label">CH</span>
        <button class="rocker-btn">▼</button>
      </div>
    </div>

    <!-- Directional Navigation D-Pad -->
    <div class="dpad-container">
      <button class="dpad-btn dpad-up">▲</button>
      <button class="dpad-btn dpad-left">◀</button>
      <button class="dpad-btn dpad-enter">ENTER</button>
      <button class="dpad-btn dpad-right">▶</button>
      <button class="dpad-btn dpad-down">▼</button>
    </div>

    <!-- Main Navigation Actions -->
    <div class="action-grid">
      <button class="btn-pill">TV / AV</button>
      <button class="btn-pill">ASPECT</button>
      <button class="btn-pill">MENU</button>
      <button class="btn-pill">SOURCE</button>
      <button class="btn-pill">EXIT</button>
      <button class="btn-pill">DISPLAY</button>
    </div>

    <!-- Special Feature Color Keys -->
    <div class="color-keys-row">
      <div class="color-btn-wrapper">
        <button class="color-btn red"></button>
        <span class="label-sub">RED</span>
      </div>
      <div class="color-btn-wrapper">
        <button class="color-btn green"></button>
        <span class="label-sub">GREEN</span>
      </div>
      <div class="color-btn-wrapper">
        <button class="color-btn yellow"></button>
        <span class="label-sub">YELLOW</span>
      </div>
      <div class="color-btn-wrapper">
        <button class="color-btn cyan"></button>
        <span class="label-sub">CYAN</span>
      </div>
    </div>

    <!-- Media Controls Grid -->
    <div class="media-grid">
      <button class="btn-circle">◀◀</button>
      <button class="btn-circle">▶▶</button>
      <button class="btn-circle">⏮</button>
      <button class="btn-circle">⏭</button>
      <button class="btn-circle">■</button>
      <button class="btn-circle">▶⏸</button>
      <button class="btn-circle">TXT</button>
      <button class="btn-circle">SUB</button>
    </div>

    <!-- Brand Header -->
    <div class="brand-logo">Onida</div>

  </div>

</body>
</html>
